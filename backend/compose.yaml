services:
  simulator-image:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    image: evasim/simulator:latest
    entrypoint: ["true"]
    restart: "no"
    networks:
      - evasim_network

  app:
    build: 
      context: ./orchestrator
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./orchestrator/audio_files:/app/audio_files
      - ./orchestrator/saved_models:/app/saved_models
    networks:
      - evasim_network
    environment:
      - EVA_SCRIPTS_DIR=${PWD}/orchestrator/eva_scripts
      - EVA_SIMULATOR_IMAGE=evasim/simulator:latest
    depends_on:
      broker:
        condition: service_started
      simulator-image:
        condition: service_completed_successfully

  broker:
    build:
      context: ./broker
      dockerfile: Dockerfile
    environment:
      - MQTT_BROKER_ADDRESS=mosquitto
    networks:
      - evasim_network

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
    networks:
      - evasim_network


networks:
  evasim_network:
    name: evasim_network
    driver: bridge